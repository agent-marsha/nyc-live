<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<title>NYC LIVE</title>
<style>
  :root{ --ink:#0B0E12; --panel:#12161C; --line:#1E242C; --fg:#E8EEF4; --dim:#7C8896; --accent:#2DD4BF; --live:#FF4D4D; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--ink); color:var(--fg); overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body{ display:flex; align-items:center; justify-content:center; }
  #stage{ position:relative; width:100%; max-width:480px; max-height:100%; aspect-ratio:4/5;
    background:var(--ink); display:flex; flex-direction:column; overflow:hidden; }
  @media (max-aspect-ratio:4/5){ #stage{ height:100%; aspect-ratio:auto; max-width:none; } }
  .mono{ font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

  header{ display:flex; align-items:center; gap:8px; padding:9px 12px 8px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  header h1{ font-size:13px; letter-spacing:.16em; margin:0; font-weight:800; }
  header .sp{ margin-left:auto; color:var(--dim); font-size:11.5px; }
  .livedot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--live); }
  .badge{ display:inline-flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.14em; font-weight:700;
    color:var(--fg); background:#0E1218; border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
  .badge.off{ color:var(--dim); }

  /* the live frame takes all the height the fixed rows don't need — it crops
     rather than overflowing, so the control bar is always visible */
  #stage .viewwrap{ position:relative; background:#05070A; flex:1 1 auto; min-height:0; overflow:hidden; }
  #view{ width:100%; height:100%; display:block; object-fit:cover; }

  .info{ padding:11px 13px 6px; flex:0 0 auto; }
  .info h2{ font-size:15.5px; margin:0 0 5px; line-height:1.35; }
  .info .row{ color:var(--dim); font-size:11.5px; letter-spacing:.04em; display:flex; gap:10px; flex-wrap:wrap; }

  .thumbs{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:8px 13px 10px; flex:0 0 auto; }
  @media (max-height:520px){ .thumbs{ display:none; } }
  .thumbs button{ padding:0; border:1px solid var(--line); background:var(--panel); border-radius:7px;
    overflow:hidden; cursor:pointer; color:var(--dim); }
  .thumbs img{ width:100%; height:52px; display:block; object-fit:cover; }
  .thumbs span{ display:block; font-size:9px; padding:3px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .bar{ margin-top:auto; display:flex; gap:7px; padding:9px 12px; border-top:1px solid var(--line); flex:0 0 auto; }
  .bar button{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--fg);
    border-radius:9px; padding:9px 0; font-size:12px; cursor:pointer; font-weight:600; }
  .bar button:hover{ border-color:#2C3541; }
  .bar a{ flex:1; text-align:center; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#06231F; border-radius:9px; font-size:11.5px; font-weight:750;
    letter-spacing:.04em; text-decoration:none; padding:9px 0; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>NYC <span style="color:var(--accent)">LIVE</span></h1>
    <span class="badge" id="badge"><span class="livedot"></span>LIVE</span>
    <span class="sp mono" id="clock">--:--:--</span>
  </header>

  <div class="viewwrap">
    <img id="view" alt="Live New York City traffic camera">
  </div>

  <div class="info">
    <h2 id="name">Connecting…</h2>
    <div class="row">
      <span id="area">—</span>
      <span class="mono" id="idx">—</span>
      <span>tap sides to change · middle for random</span>
    </div>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <div class="bar">
    <button id="prev" type="button">‹ Prev</button>
    <button id="rand" type="button">Random</button>
    <button id="next" type="button">Next ›</button>
    <button id="pause" type="button">Pause</button>
    <a href="../" target="_top">SITE ↗</a>
  </div>
</div>
<script src="live.js"></script>
</body>
</html>
